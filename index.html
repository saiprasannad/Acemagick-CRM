function AppProvider({ children }) {

  const [currentUser, setCurrentUser] = useState(() => getStore('currentUser', null));
  const [view, setView] = useState('dashboard');

  const [quotations, setQuotations] = useState(() => getStore('quotations', []));
  const [invoices, setInvoices] = useState(() => getStore('invoices', []));
  
  const [users, setUsers] = useState(() => getStore('users', []));
  const [invitations, setInvitations] = useState([]);
  const [orgDepartments, setOrgDepartments] = useState(() => getStore('orgDepartments', []));
  
  const [pipelines, setPipelines] = useState(() => getStore('pipelines', INITIAL_PIPELINES));

  const [emailConfig, setEmailConfig] = useState(() => getStore('emailConfig', { serviceId: '', templateId: '', publicKey: '', fromName: '', fromEmail: '', signature: '', connected: false }));
  const [emailMessages, setEmailMessages] = useState(() => getStore('emailMessages', []));
  
  const [whatsappTarget, setWhatsappTarget] = useState(null);

  const allStages = useMemo(() => pipelines.flatMap(p => p.stages.map(s => ({ ...s, pipelineId: p.id, pipelineName: p.name }))), [pipelines]);

  useEffect(() => {
    const loadCloudData = async () => {
      const { data: dbUsers } = await supabase.from('users').select('*');
      if (dbUsers && dbUsers.length > 0) {
        setUsers(dbUsers.map(u => ({ ...u, memberships: u.memberships || [] })));
      } else {
        setUsers(prev => prev.map(u => ({ ...u, memberships: u.memberships || [] })));
      }
      const { data: dbInvites } = await supabase.from('invitations').select('*');
      if (dbInvites) setInvitations(dbInvites);
    };
    loadCloudData();
  }, []);

  useEffect(() => { setStore('leads', leads) }, [leads]);
  useEffect(() => { setStore('conversations', conversations) }, [conversations]);
  useEffect(() => { setStore('calls', calls) }, [calls]);
  useEffect(() => { setStore('quotations', quotations) }, [quotations]);
  useEffect(() => { setStore('invoices', invoices) }, [invoices]);
  useEffect(() => { setStore('users', users) }, [users]);
  useEffect(() => { setStore('orgDepartments', orgDepartments) }, [orgDepartments]);
  useEffect(() => { setStore('pipelines', pipelines) }, [pipelines]);
  useEffect(() => { setStore('tunnels', tunnels) }, [tunnels]);
  useEffect(() => { setStore('emailConfig', emailConfig) }, [emailConfig]);
  useEffect(() => { setStore('emailMessages', emailMessages) }, [emailMessages]);
  useEffect(() => { if (loggedIn && currentUser) setStore('session', { active: true }); }, [loggedIn, currentUser]);

  const toast = useCallback((msg, type = 'success') => { const id = genId(); setToasts(p => [...p, { id, msg, type }]); setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500) }, []);
  const navigate = useCallback(v => setView(v), []);

  const transitionLead = useCallback((leadId, newStageId) => {
    const tunnel = tunnels.find(t => t.fromStageId === newStageId);
    const sourceStage = allStages.find(s => s.id === newStageId);
    const sourceLabel = sourceStage ? sourceStage.label : newStageId;

    if (!tunnel) {
      setLeads(prev => prev.map(l => l.id === leadId ? {
        ...l, stage: newStageId, updatedAt: Date.now(),
        activities: [...(l.activities || []), { type: 'stage', text: 'Moved to ' + sourceLabel, at: Date.now(), author: currentUser?.name || 'System' }]
      } : l));
    } else {
      const destStage = allStages.find(s => s.id === tunnel.toStageId);
      const destPipeline = pipelines.find(p => p.id === tunnel.toPipelineId);
      const destLabel = destStage ? destStage.label : tunnel.toStageId;
      const destPipeName = destPipeline ? destPipeline.name : '';

      if (tunnel.action === 'move') {
        setLeads(prev => prev.map(l => l.id === leadId ? {
          ...l, stage: tunnel.toStageId, updatedAt: Date.now(),
          activities: [...(l.activities || []), { type: 'stage', text: `Moved via tunnel to ${destPipeName} > ${destLabel}`, at: Date.now(), author: 'Tunnel Automation' }]
        } : l));
        toast(`Lead automatically moved via tunnel to ${destLabel}`);
      } else if (tunnel.action === 'copy') {
        setLeads(prev => {
          const orig = prev.find(l => l.id === leadId);
          if (!orig) return prev;
          const updatedOrig = { ...orig, stage: newStageId, updatedAt: Date.now(), activities: [...(orig.activities || []), { type: 'stage', text: `Copied via tunnel to ${destPipeName} > ${destLabel}`, at: Date.now(), author: 'Tunnel Automation' }] };
          const copy = { ...orig, id: genId(), stage: tunnel.toStageId, name: orig.name + ' (Copy)', createdAt: Date.now(), updatedAt: Date.now(), activities: [{ type: 'stage', text: `Copied via tunnel from ${sourceLabel}`, at: Date.now(), author: 'Tunnel Automation' }] };
          return [...prev.map(l => l.id === leadId ? updatedOrig : l), copy];
        });
        toast(`Lead automatically copied via tunnel to ${destLabel}`);
      }
    }
  }, [tunnels, allStages, pipelines, toast, setLeads, currentUser]);

function AcceptInviteModal({ prefilledToken = '' }) {
  const { invitations, setInvitations, users, setUsers, toast, setModalContent, setLoggedIn, setCurrentUser } = useApp();
  const [token, setToken] = useState(prefilledToken);
  const [pass, setPass] = useState('');
  const [confirmPass, setConfirmPass] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const handleAccept = async () => {
    setError(''); setLoading(true);
    const { data: currentInvite, error: fetchError } = await supabase.from('invitations').select('*').eq('token', token).single();
    if (!currentInvite || fetchError) { setError('Invalid invite token.'); setLoading(false); return; }
    if (currentInvite.status === 'accepted') { setError('This invite has already been used.'); setLoading(false); return; }
    if (Date.now() > new Date(currentInvite.expires_at).getTime()) { setError('This invite has expired.'); setLoading(false); return; }
    if (pass.length < 6) { setError('Password must be at least 6 characters.'); setLoading(false); return; }
    if (pass !== confirmPass) { setError('Passwords do not match.'); setLoading(false); return; }
    const { data: existingUser } = await supabase.from('users').select('*').eq('email', currentInvite.email).single();
    let loggedInUser;
    if (existingUser) {
      const { data: updatedUser } = await supabase.from('users').update({ status: 'active', password: pass, role: 'Agent' }).eq('id', existingUser.id).select().single();
      loggedInUser = updatedUser;
    } else {
      const newUser = { name: currentInvite.email.split('@')[0], email: currentInvite.email, phone: currentInvite.phone || '', role: 'Agent', status: 'active', password: pass };
      const { data: insertedUser } = await supabase.from('users').insert(newUser).select().single();
      loggedInUser = insertedUser;
    }
    setUsers(prev => { const exists = prev.some(u => u.id === loggedInUser.id); return exists ? prev.map(u => u.id === loggedInUser.id ? loggedInUser : u) : [...prev, loggedInUser]; });
    const { data: updatedInvite } = await supabase.from('invitations').update({ status: 'accepted' }).eq('id', currentInvite.id).select().single();
    setInvitations(prev => prev.map(inv => inv.id === currentInvite.id ? updatedInvite : inv));
    setStore('session', { active: true }); setStore('currentUser', loggedInUser); setCurrentUser(loggedInUser); setLoggedIn(true); setModalContent(null); toast('Invite accepted! Welcome to the team.'); setLoading(false);
  };
  return (
    <div className="p-6 max-w-md mx-auto">
      <div className="flex items-center justify-between mb-6"><h2 className="text-xl font-bold text-gray-800">Accept Invitation</h2><button onClick={() => setModalContent(null)} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-lg"></i></button></div>
      <div className="space-y-4">
        <div><label className="text-xs font-medium text-gray-500 mb-1 block">Invitation Token</label><input value={token} onChange={e => setToken(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" placeholder="Paste your invite token here" /></div>
        <div><label className="text-xs font-medium text-gray-500 mb-1 block">Create Password</label><input type="password" value={pass} onChange={e => setPass(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" placeholder="Min 6 characters" /></div>
        <div><label className="text-xs font-medium text-gray-500 mb-1 block">Confirm Password</label><input type="password" value={confirmPass} onChange={e => setConfirmPass(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" /></div>
        {error && <p className="text-red-500 text-xs">{error}</p>}
        <button onClick={handleAccept} disabled={loading} className="w-full bg-brand-500 text-white py-3 rounded-xl font-medium text-sm hover:bg-brand-600 flex items-center justify-center gap-2">{loading ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Accept & Create Account'}</button>
      </div>
    </div>
  );
}

function LeadsView() {
  const { setModalContent, pipelines, leads, currentUser } = useApp();
  const [subView, setSubView] = useState('kanban');
  const [activePipelineId, setActivePipelineId] = useState(pipelines[0]?.id || 'all');
  const [searchText, setSearchText] = useState('');
  const [dateFilter, setDateFilter] = useState('all');
  const [customDateFrom, setCustomDateFrom] = useState('');
  const [customDateTo, setCustomDateTo] = useState('');

  const filteredLeads = useMemo(() => {
    let res = leads;
    if (currentUser?.role !== 'Admin') res = res.filter(l => l.assignedTo === currentUser?.id);
    
    if (searchText.trim()) {
      const q = searchText.toLowerCase();
      res = res.filter(l => 
        l.name?.toLowerCase().includes(q) || 
        l.email?.toLowerCase().includes(q) || 
        l.phone?.replace(/\D/g, '').includes(q.replace(/\D/g, ''))
      );
    }
    
    if (activePipelineId !== 'all') {
      const pipe = pipelines.find(p => p.id === activePipelineId);
      if (pipe) {
        const stageIds = pipe.stages.map(s => s.id);
        res = res.filter(l => stageIds.includes(l.stage));
      }
    }
    
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (dateFilter === 'today') res = res.filter(l => l.createdAt >= startOfToday);
    if (dateFilter === 'yesterday') res = res.filter(l => l.createdAt >= startOfToday - 86400000 && l.createdAt < startOfToday);
    if (dateFilter === '7days') res = res.filter(l => l.createdAt >= startOfToday - 7 * 86400000);
    if (dateFilter === '30days') res = res.filter(l => l.createdAt >= startOfToday - 30 * 86400000);
    if (dateFilter === 'month') res = res.filter(l => l.createdAt >= new Date(now.getFullYear(), now.getMonth(), 1).getTime());
    if (dateFilter === 'last_month') {
      const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1).getTime();
      const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      res = res.filter(l => l.createdAt >= lastMonth && l.createdAt < thisMonth);
    }
    if (dateFilter === 'custom' && customDateFrom && customDateTo) {
      const from = new Date(customDateFrom).getTime();
      const to = new Date(customDateTo).getTime() + 86400000;
      res = res.filter(l => l.createdAt >= from && l.createdAt <= to);
    }
    
    return res;
  }, [leads, searchText, activePipelineId, dateFilter, customDateFrom, customDateTo, currentUser, pipelines]);

  const clearFilters = () => {
    setSearchText(''); setDateFilter('all'); setCustomDateFrom(''); setCustomDateTo('');
    if (subView === 'all') setActivePipelineId('all');
    else setActivePipelineId(pipelines[0]?.id || 'all');
  };

  return (
    <div className="fade-in flex flex-col gap-4">
      <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <div className="flex gap-1 bg-gray-100 rounded-lg p-1">
            {['kanban', 'list', 'all'].map(v => (
              <button key={v} onClick={() => { setSubView(v); if(v !== 'all' && activePipelineId === 'all') setActivePipelineId(pipelines[0]?.id || ''); if(v === 'all') setActivePipelineId('all'); }} className={"px-4 py-1.5 rounded-md text-sm font-medium transition-all " + (subView === v ? 'bg-white shadow text-gray-800' : 'text-gray-500')}>
                {v === 'all' ? 'All Deals' : v.charAt(0).toUpperCase() + v.slice(1)}
              </button>
            ))}
          </div>
          {subView !== 'all' && (
            <select value={activePipelineId} onChange={e => setActivePipelineId(e.target.value)} className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm bg-white">
              {pipelines.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          )}
        </div>
        <div className="flex gap-2">
          <button onClick={() => setModalContent(<ImportModal />)} className="bg-white border border-gray-200 text-gray-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 flex items-center gap-2"><i className="fa-solid fa-file-import"></i>Import</button>
          <button onClick={() => setModalContent(<ExportModal leads={filteredLeads} />)} className="bg-white border border-gray-200 text-gray-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 flex items-center gap-2"><i className="fa-solid fa-file-export"></i>Export</button>
          <button onClick={() => setModalContent(<CreateLeadModal defaultPipelineId={activePipelineId === 'all' ? (pipelines[0]?.id || '') : activePipelineId} />)} className="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2"><i className="fa-solid fa-plus"></i>Add Lead</button>
        </div>
      </div>

      <div className="bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex flex-wrap items-center gap-3">
        <input type="text" value={searchText} onChange={e => setSearchText(e.target.value)} placeholder="Search name, email, phone..." className="flex-1 min-w-[200px] border border-gray-200 rounded-lg px-3 py-1.5 text-sm" />
        {subView === 'all' && (
          <select value={activePipelineId} onChange={e => setActivePipelineId(e.target.value)} className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm bg-white">
            <option value="all">All Pipelines</option>
            {pipelines.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        )}
        <select value={dateFilter} onChange={e => setDateFilter(e.target.value)} className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm bg-white">
          <option value="all">Any Date</option>
          <option value="today">Today</option>
          <option value="yesterday">Yesterday</option>
          <option value="7days">Last 7 Days</option>
          <option value="30days">Last 30 Days</option>
          <option value="month">This Month</option>
          <option value="last_month">Last Month</option>
          <option value="custom">Custom Range</option>
        </select>
        {dateFilter === 'custom' && (
          <div className="flex items-center gap-2">
            <input type="date" value={customDateFrom} onChange={e => setCustomDateFrom(e.target.value)} className="border border-gray-200 rounded-lg px-2 py-1.5 text-sm" />
            <span className="text-xs text-gray-500">to</span>
            <input type="date" value={customDateTo} onChange={e => setCustomDateTo(e.target.value)} className="border border-gray-200 rounded-lg px-2 py-1.5 text-sm" />
          </div>
        )}
        <button onClick={clearFilters} className="text-xs text-gray-500 hover:text-gray-700 px-3 py-1.5">Clear Filters</button>
      </div>

      {subView === 'kanban' && <KanbanView activePipelineId={activePipelineId} leads={filteredLeads} />}
      {subView === 'list' && <ListView leads={filteredLeads} />}
      {subView === 'all' && <AllDealsView leads={filteredLeads} pipelines={pipelines} />}
    </div>
  );
}

function KanbanView({ activePipelineId, leads }) {
  const { transitionLead, setModalContent, pipelines, tunnels } = useApp();
  const [dragId, setDragId] = useState(null); const [overStage, setOverStage] = useState(null);
  const activePipeline = pipelines.find(p => p.id === activePipelineId) || { stages: [] };

  const handleDrop = (stageId) => {
    if (!dragId) return;
    transitionLead(dragId, stageId);
    setDragId(null); setOverStage(null);
  };

  return (
    <div className="flex gap-4 overflow-x-auto pb-4">
      {activePipeline.stages.map(s => {
        const sLeads = leads.filter(l => l.stage === s.id);
        const hasTunnel = tunnels.some(t => t.fromStageId === s.id);

function ExportModal({ leads, onClose }) {
  const { toast, pipelines } = useApp();
  const [format, setFormat] = useState('csv');

  const handleExport = () => {
    try {
      if (!leads || leads.length === 0) {
        toast('No leads found to export with current filters.', 'error');
        return;
      }

      const data = leads.map(l => {
        const pipe = pipelines.find(p => p.stages.some(s => s.id === l.stage));
        const stage = pipe?.stages.find(s => s.id === l.stage);
        return {
          ID: l.id,
          Name: l.name,
          Phone: l.phone,
          Email: l.email,
          Company: l.company,
          Pipeline: pipe?.name || 'Unknown',
          Stage: stage?.label || 'Unknown',
          Budget: l.budget,
          Source: l.source,
          CreatedAt: new Date(l.createdAt).toLocaleString(),
          UpdatedAt: new Date(l.updatedAt).toLocaleString()
        };
      });

      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Leads");
      
      XLSX.writeFile(wb, `NexaCRM_Leads_Export.${format}`, { bookType: format });
      toast('Export successful!');
      onClose();
    } catch (error) {
      console.error("Export Error:", error);
      toast('Export failed. Check console for details.', 'error');
    }
  };

  return (
    <div className="p-6 max-w-md mx-auto">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-xl font-bold text-gray-800">Export Deals</h2>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div className="space-y-4">
        <div className="bg-gray-50 p-3 rounded-lg text-sm text-gray-600">Exporting <b>{leads.length}</b> records (respecting current filters).</div>
        <div>
          <label className="text-xs font-medium text-gray-500 mb-1 block">Format</label>
          <div className="flex gap-2">
            <button onClick={() => setFormat('csv')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${format === 'csv' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-500'}`}>CSV</button>
            <button onClick={() => setFormat('xlsx')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${format === 'xlsx' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-500'}`}>Excel (.xlsx)</button>
          </div>
        </div>
        <button onClick={handleExport} className="w-full bg-brand-500 text-white py-3 rounded-xl font-medium text-sm hover:bg-brand-600">Export</button>
      </div>
    </div>
  );
}

function ImportModal({ onClose }) {
  const { leads, setLeads, pipelines, toast, currentUser } = useApp();
  const [step, setStep] = useState(1);
  const [targetPipelineId, setTargetPipelineId] = useState(pipelines[0]?.id || '');
  const [defaultStageId, setDefaultStageId] = useState('');
  const [fileData, setFileData] = useState([]);
  const [headers, setHeaders] = useState([]);
  const [mapping, setMapping] = useState({});
  const [newRecords, setNewRecords] = useState([]);
  const [duplicates, setDuplicates] = useState([]);
  const [errorsList, setErrorsList] = useState([]);
  const [duplicateAction, setDuplicateAction] = useState('skip');
  const fileInputRef = useRef(null);

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const data = new Uint8Array(event.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
      if (json.length > 0) {
        setHeaders(json[0]);
        setFileData(json.slice(1));
        const autoMap = {};
        json[0].forEach(h => {
          const lower = String(h).toLowerCase();
          if (lower.includes('name')) autoMap[h] = 'name';
          else if (lower.includes('phone') || lower.includes('mobile')) autoMap[h] = 'phone';
          else if (lower.includes('email')) autoMap[h] = 'email';
          else if (lower.includes('company')) autoMap[h] = 'company';
          else if (lower.includes('budget') || lower.includes('amount')) autoMap[h] = 'budget';
          else if (lower.includes('stage')) autoMap[h] = 'stage';
          else if (lower.includes('source')) autoMap[h] = 'source';
        });
        setMapping(autoMap);
        setStep(2);
      } else {
        toast('The uploaded file is empty.', 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const analyzeImport = () => {
    const pipe = pipelines.find(p => p.id === targetPipelineId);
    if (!pipe) return toast('Invalid pipeline', 'error');
    
    const validNew = [];
    const dups = [];
    const errs = [];
    
    fileData.forEach((row, idx) => {
      const newLead = {
        id: genId(),
        assignedTo: currentUser?.id || 'u1',
        createdAt: Date.now(),
        updatedAt: Date.now(),
        notes: '',
        activities: [{ type: 'note', text: 'Imported via CSV/Excel', at: Date.now() }]
      };
      
      headers.forEach((h, i) => {
        const crmField = mapping[h];
        if (crmField && row[i]) {
          newLead[crmField] = String(row[i]);
        }
      });
      
      let finalStage = defaultStageId;
      if (newLead.stage) {
        const mappedStage = pipe.stages.find(s => s.label.toLowerCase() === newLead.stage.toLowerCase());
        if (mappedStage) finalStage = mappedStage.id;
      }
      newLead.stage = finalStage || pipe.stages[0]?.id;
      
      if (!newLead.name) {
        errs.push(`Row ${idx + 2}: Name missing.`);
        return;
      }
      
      const existing = leads.find(l => 
        (l.email && newLead.email && l.email.toLowerCase() === newLead.email.toLowerCase()) || 
        (l.phone && newLead.phone && l.phone.replace(/\D/g, '') === newLead.phone.replace(/\D/g, ''))
      );
      
      if (existing) {
        dups.push({ imported: newLead, existing: existing });
      } else {
        validNew.push(newLead);
      }
    });
    
    setNewRecords(validNew);
    setDuplicates(dups);
    setErrorsList(errs);
    setStep(3);
  };

  const finalImport = () => {
    let finalLeadsToAdd = [...newRecords];
    
    if (duplicateAction === 'new') {
      duplicates.forEach(d => finalLeadsToAdd.push(d.imported));
    } else if (duplicateAction === 'update') {
      setLeads(prev => {
        const updatedPrev = prev.map(l => {
          const dup = duplicates.find(d => d.existing.id === l.id);
          if (dup) {
            return { 
              ...l, 
              ...dup.imported, 
              id: l.id, 
              createdAt: l.createdAt, 
              activities: l.activities,
              updatedAt: Date.now() 
            };
          }
          return l;
        });
        return [...updatedPrev, ...finalLeadsToAdd];
      });
      toast(`Import complete! Added ${newRecords.length} new, updated ${duplicates.length} existing.`);
      onClose();
      return;
    }
    
    setLeads(prev => [...prev, ...finalLeadsToAdd]);
    toast(`Import complete! Added ${finalLeadsToAdd.length} records.`);
    onClose();
  };

  return (
    <div className="p-6 max-w-2xl mx-auto">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-xl font-bold text-gray-800">Import Deals</h2>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-lg"></i></button>
      </div>

      {step === 1 && (
        <div className="space-y-4">
          <div>
            <label className="text-xs font-medium text-gray-500 mb-1 block">Select Target Pipeline</label>
            <select value={targetPipelineId} onChange={e => { setTargetPipelineId(e.target.value); setDefaultStageId(''); }} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm bg-white">
              {pipelines.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs font-medium text-gray-500 mb-1 block">Default Stage (if not in file)</label>
            <select value={defaultStageId} onChange={e => setDefaultStageId(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm bg-white">
              <option value="">-- Select Stage --</option>
              {pipelines.find(p => p.id === targetPipelineId)?.stages.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
          </div>
          <div className="bg-gray-50 p-6 rounded-xl border-2 border-dashed border-gray-200 text-center cursor-pointer" onClick={() => fileInputRef.current?.click()}>
            <i className="fa-solid fa-cloud-arrow-up text-4xl text-gray-400 mb-3"></i>
            <p className="text-sm font-medium text-gray-600">Click to upload CSV or Excel</p>
            <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".csv,.xlsx,.xls" className="hidden" />
          </div>
        </div>
      )}

      {step === 2 && (
        <div className="space-y-4">
          <h3 className="text-sm font-semibold text-gray-700">Map Fields</h3>
          <div className="overflow-x-auto">
            <table className="w-full text-sm border border-gray-100 rounded-lg">
              <thead className="bg-gray-50">
                <tr>
                  <th className="p-2 text-left text-xs text-gray-500">Uploaded Column</th>
                  <th className="p-2 text-left text-xs text-gray-500">NexaCRM Field</th>
                </tr>
              </thead>
              <tbody>
                {headers.map(h => (
                  <tr key={h} className="border-t border-gray-100">
                    <td className="p-2 font-medium text-gray-700">{h}</td>
                    <td className="p-2">
                      <select value={mapping[h] || ''} onChange={e => setMapping(prev => ({ ...prev, [h]: e.target.value }))} className="w-full border border-gray-200 rounded px-2 py-1 text-xs bg-white">
                        <option value="">-- Ignore --</option>
                        <option value="name">Name</option>
                        <option value="phone">Phone</option>
                        <option value="email">Email</option>
                        <option value="company">Company</option>
                        <option value="budget">Budget</option>
                        <option value="stage">Stage</option>
                        <option value="source">Source</option>
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <button onClick={analyzeImport} className="w-full bg-brand-500 text-white py-3 rounded-xl font-medium text-sm hover:bg-brand-600">Analyze & Preview Import</button>
        </div>
      )}

      {step === 3 && (
        <div className="space-y-4">
          <div className="grid grid-cols-4 gap-3">
            <div className="bg-gray-50 p-3 rounded-lg text-center"><div className="text-2xl font-bold text-gray-800">{fileData.length}</div><div className="text-xs text-gray-500">Total</div></div>
            <div className="bg-green-50 p-3 rounded-lg text-center"><div className="text-2xl font-bold text-green-600">{newRecords.length}</div><div className="text-xs text-green-600">New</div></div>
            <div className="bg-amber-50 p-3 rounded-lg text-center"><div className="text-2xl font-bold text-amber-600">{duplicates.length}</div><div className="text-xs text-amber-600">Duplicates</div></div>
            <div className="bg-red-50 p-3 rounded-lg text-center"><div className="text-2xl font-bold text-red-600">{errorsList.length}</div><div className="text-xs text-red-600">Errors</div></div>
          </div>
          
          {errorsList.length > 0 && (
            <div className="bg-red-50 p-3 rounded-lg max-h-32 overflow-y-auto">
              <h4 className="text-xs font-semibold text-red-700 mb-2">Error Details:</h4>
              <ul className="text-xs text-red-600 space-y-1">{errorsList.map((err, i) => <li key={i}>{err}</li>)}</ul>
            </div>
          )}

          {duplicates.length > 0 && (
            <div className="bg-amber-50 p-4 rounded-lg space-y-3">
              <div className="flex items-center justify-between">
                <h4 className="text-sm font-semibold text-amber-800">Potential Duplicates Found</h4>
                <select value={duplicateAction} onChange={e => setDuplicateAction(e.target.value)} className="text-xs border border-amber-300 rounded-lg px-2 py-1 bg-white">
                  <option value="skip">Skip All</option>
                  <option value="new">Import All as New</option>
                  <option value="update">Update Existing</option>
                </select>
              </div>
              <div className="max-h-48 overflow-y-auto space-y-2">
                {duplicates.map((d, i) => (
                  <div key={i} className="bg-white p-2 rounded-md border border-amber-100 text-xs grid grid-cols-2 gap-2">
                    <div>
                      <span className="font-bold text-gray-600">Imported:</span><br/>
                      <span className="text-gray-700">{d.imported.name}</span><br/>
                      <span className="text-gray-500">{d.imported.email} | {d.imported.phone}</span>
                    </div>
                    <div>
                      <span className="font-bold text-gray-600">Existing:</span><br/>
                      <span className="text-gray-700">{d.existing.name}</span><br/>
                      <span className="text-gray-500">{d.existing.email} | {d.existing.phone}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="flex gap-3">
            <button onClick={() => setStep(2)} className="flex-1 bg-gray-100 text-gray-600 py-3 rounded-xl font-medium text-sm hover:bg-gray-200">Back</button>
            <button onClick={finalImport} className="flex-1 bg-brand-500 text-white py-3 rounded-xl font-medium text-sm hover:bg-brand-600">
              Complete Import ({newRecords.length + (duplicateAction === 'new' ? duplicates.length : 0)})
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

  const lead = leads.find(l => l.id === leadId);
  const [comment, setComment] = useState('');
  const [editNotes, setEditNotes] = useState(lead ? lead.notes : '');
  const [showNotes, setShowNotes] = useState(false);
  const scrollRef = useRef(null);
  const waConfig = getStore('whatsappConfig', { instanceId: '', token: '' });
  const [waMessages, setWaMessages] = useState([]);
  const [waInput, setWaInput] = useState('');
  const waPollRef = useRef(null);
  const activities = lead ? (lead.activities || []) : [];

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [activities.length]);
  useEffect(() => { if (lead) setEditNotes(lead.notes); }, [leadId, lead]);

  useEffect(() => {
    if (!lead?.phone || !waConfig.instanceId) return;
    const fetchLeadWaMessages = async () => {
      const chatId = getChatId(lead.phone);
      try {
        const res = await fetch(`https://api.ultramsg.com/${waConfig.instanceId}/chats/messages?token=${waConfig.token}&chatId=${chatId}&limit=100`);
        const data = await res.json();
        if (Array.isArray(data)) {
          const sorted = data.sort((a, b) => a.time - b.time);
          setWaMessages(sorted);
          const lastLoggedId = lead.lastWaId || "";
          const newIncoming = sorted.filter(m => !parseIsMe(m) && String(m.id) > String(lastLoggedId));
          if (newIncoming.length > 0) {
            const latestId = newIncoming[newIncoming.length - 1].id;
            setLeads(prev => prev.map(l => {
              if (l.id === leadId) {
                const newActivities = newIncoming.map(m => ({ type: 'whatsapp', text: `Customer replied: ${m.text || m.body || ''}`, at: Date.now(), author: l.name }));
                return { ...l, activities: [...(l.activities || []), ...newActivities], lastWaId: latestId };
              }
              return l;
            }));
          }
        }
      } catch (e) { console.error("WA fetch error", e); }
    };
    fetchLeadWaMessages(); 
    waPollRef.current = setInterval(fetchLeadWaMessages, 3000); 
    return () => clearInterval(waPollRef.current);
  }, [leadId, lead?.phone, waConfig.instanceId, waConfig.token, setLeads]);

  if (!lead) return null;

  const addComment = () => { if (!comment.trim()) return; setLeads(prev => prev.map(l => l.id === leadId ? { ...l, updatedAt: Date.now(), activities: [...(l.activities || []), { type: 'note', text: comment.trim(), at: Date.now(), author: currentUser?.name || 'Admin User' }] } : l)); setComment(''); };
  const moveStage = (stageId) => { transitionLead(leadId, stageId); toast('Stage updated'); };
  const saveNotes = () => { setLeads(prev => prev.map(l => l.id === leadId ? { ...l, notes: editNotes } : l)); toast('Notes saved'); setShowNotes(false); };
  const fmtFullDate = ts => { const d = new Date(ts); return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) + ' at ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); };
  const handleWhatsAppClick = () => { if (!lead.phone) return toast('No phone number available', 'error'); setWhatsappTarget(lead.id); setModalContent(null); navigate('whatsapp'); toast('Opening WhatsApp chat...'); };

  const handleLeadWaSend = async () => {
    if (!waInput.trim() || !lead.phone) { if (!lead.phone) toast('No phone number for this lead', 'error'); return; }
    if (!waConfig.instanceId || !waConfig.token) { toast('WhatsApp API not connected. Go to WhatsApp tab.', 'error'); return; }
    const chatId = getChatId(lead.phone);
    const msgText = waInput;
    setWaInput('');
    try {
      const res = await fetch(`https://api.ultramsg.com/${waConfig.instanceId}/messages/chat`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: waConfig.token, to: chatId, body: msgText })
      });
      const data = await res.json();
      if (data === true || data.sent === true || data.sent === 'true') {
        setWaMessages(prev => [...prev, { from: 'me', text: msgText, time: Math.floor(Date.now()/1000) }]);
        setLeads(prev => prev.map(l => l.id === leadId ? { ...l, updatedAt: Date.now(), activities: [...(l.activities || []), { type: 'whatsapp', text: `You sent: ${msgText}`, at: Date.now(), author: currentUser?.name || 'System' }] } : l));
        toast('Message sent!');
      } else { toast('Failed to send via WhatsApp: ' + (data.error || ''), 'error'); }
    } catch (e) { toast('Network error sending message', 'error'); }
  };

  return (
    <div className="p-0 flex" style={{ minHeight: '70vh' }}>
      <div className="w-[340px] shrink-0 border-r border-gray-100 overflow-y-auto p-6" style={{ maxHeight: '85vh' }}>
        <div className="flex items-center gap-3 mb-6"><div className="w-12 h-12 rounded-2xl bg-brand-50 flex items-center justify-center text-lg font-bold text-brand-600">{lead.name.split(' ').map(n => n[0]).join('')}</div><div className="min-w-0 flex-1"><div className="text-base font-bold text-gray-800 truncate">{lead.name}</div><div className="text-xs text-gray-400 truncate">{lead.company || 'No company'}</div></div></div>
        <div className="mb-5"><div className="text-[10px] font-semibold text-gray-400 uppercase mb-2">Stage</div><div className="flex flex-col gap-2">{pipelines.map(p => (<div key={p.id}><div className="text-[10px] text-gray-400 mb-1">{p.name}</div><div className="flex flex-wrap gap-1.5">{p.stages.map(s => (<button key={s.id} onClick={() => moveStage(s.id)} className={"px-2.5 py-1 rounded-md text-[11px] font-medium border transition-all " + (lead.stage === s.id ? 'border-transparent text-white shadow-sm' : 'border-gray-200 text-gray-500 hover:border-gray-300')} style={lead.stage === s.id ? { background: s.color } : {}}>{s.label}</button>))}</div></div>))}</div></div>
        <div className="space-y-3 mb-5">
          {[
            ['Phone', lead.phone, 'fa-solid fa-phone', 'text-blue-500'], 
            ['Email', lead.email || '—', 'fa-solid fa-envelope', 'text-purple-500'], 
            ['Interest', lead.interest || '—', 'fa-solid fa-tag', 'text-amber-500'], 
            ['Budget', lead.budget || '—', 'fa-solid fa-indian-rupee-sign', 'text-emerald-500'], 
            ['Timeline', lead.timeline || '—', 'fa-solid fa-clock', 'text-gray-500'], 
            ['Source', lead.source || '—', 'fa-solid fa-link', 'text-gray-500']
          ].map(([label, val, icon, iconColor]) => (
            <div key={label} className="flex items-start gap-2.5">
              <i className={`${icon} ${iconColor} text-xs mt-1 w-4 text-center`}></i>
              <div className="flex items-center gap-2">
                <div><div className="text-[10px] text-gray-400 font-medium">{label}</div><div className="text-xs text-gray-700">{val || '—'}</div></div>
                {label === 'Phone' && lead.phone && (<button onClick={handleWhatsAppClick} className="text-green-500 hover:text-green-600 mt-0.5" title="Chat on WhatsApp"><i className="fa-brands fa-whatsapp text-sm"></i></button>)}
              </div>
            </div>
          ))}
        </div>
        <div className="mt-6 border-t border-gray-100 pt-4">
          <div className="flex items-center justify-between mb-2">
            <div className="text-[10px] font-semibold text-gray-400 uppercase">WhatsApp Chat</div>
            {waConfig.instanceId ? <span className="text-[9px] text-green-500 font-medium">Connected</span> : <button onClick={() => { setModalContent(null); navigate('whatsapp'); }} className="text-[9px] text-brand-500 font-medium">Connect API</button>}
          </div>
          <div className="bg-[#e5ddd5] rounded-xl border border-gray-200 h-48 overflow-y-auto p-3 space-y-3 flex flex-col">
            {waMessages.length === 0 && <div className="text-center text-xs text-gray-500 self-center">No messages yet. Start the conversation!</div>}
            {waMessages.map((m, i) => {
              const isMe = parseIsMe(m);
              const text = m.text || m.body || m.message || '';
              const timeStr = formatMsgTime(m.time);
              const senderLabel = isMe ? `AGENT - ${currentUser?.name || 'Admin'}` : `CUSTOMER - ${lead.name || 'Unknown'}`;
              const senderColor = isMe ? 'text-green-600' : 'text-gray-500';
              return (
                <div key={m.id || i} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                  <div className={`text-[10px] mb-0.5 px-2 font-bold uppercase tracking-wide ${senderColor}`}>{senderLabel}</div>
                  <div className={`max-w-[75%] px-3 py-2 text-xs shadow-sm ${isMe ? 'bg-[#d9fdd3] text-gray-800 rounded-lg rounded-tr-none' : 'bg-white text-gray-800 rounded-lg rounded-tl-none'}`}>
                    {text}<div className="text-[9px] text-gray-500 mt-0.5 text-right">{timeStr}</div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="flex gap-2 mt-2">
            <input value={waInput} onChange={e => setWaInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLeadWaSend()} placeholder="Type WhatsApp message..." className="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs" />
            <button onClick={handleLeadWaSend} className="bg-brand-500 hover:bg-brand-600 text-white px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1"><i className="fa-solid fa-paper-plane text-[10px]"></i></button>
          </div>
        </div>
        <div className="mb-4 mt-6"><button onClick={() => setShowNotes(!showNotes)} className="text-xs font-medium text-gray-500 hover:text-gray-700 flex items-center gap-1.5"><i className={"fa-solid fa-chevron-" + (showNotes ? 'up' : 'down') + " text-[10px]"}></i>Internal Notes</button>{showNotes && (<div className="mt-2"><textarea value={editNotes} onChange={e => setEditNotes(e.target.value)} className="w-full border border-gray-200 rounded-xl px-3 py-2 text-xs resize-none h-20" placeholder="Add internal notes..." /><button onClick={saveNotes} className="mt-1.5 bg-brand-500 text-white px-3 py-1.5 rounded-lg text-[11px] font-medium">Save</button></div>)}</div>
        <div className="pt-4 border-t border-gray-100 space-y-2">
          <button onClick={() => { setModalContent(null); navigate('email'); }} className="w-full bg-purple-50 text-purple-600 hover:bg-purple-100 py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-2"><i className="fa-solid fa-envelope"></i>Send Email</button>
          <button onClick={handleWhatsAppClick} className="w-full bg-green-50 text-green-600 hover:bg-green-100 py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-2"><i className="fa-brands fa-whatsapp"></i>Open WhatsApp Chat</button>
          <button onClick={() => { setModalContent(null); navigate('calls'); }} className="w-full bg-blue-50 text-blue-600 hover:bg-blue-100 py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-2"><i className="fa-solid fa-phone"></i>Call</button>
        </div>
      </div>
      <div className="flex-1 flex flex-col overflow-hidden">
        <div className="px-6 py-3 border-b border-gray-100 flex items-center justify-between shrink-0"><div className="flex items-center gap-2"><i className="fa-solid fa-comments text-brand-500"></i><span className="text-sm font-semibold text-gray-800">Comments & Activity</span><span className="bg-gray-100 text-gray-500 text-[10px] px-2 py-0.5 rounded-full">{activities.length}</span></div></div>
        <div className="px-6 py-3 border-b border-gray-50 shrink-0 bg-gray-50/50"><div className="flex gap-3"><div className="w-8 h-8 rounded-full bg-brand-100 flex items-center justify-center text-xs font-bold text-brand-600 shrink-0">A</div><div className="flex-1"><textarea value={comment} onChange={e => setComment(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addComment(); } }} className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm resize-none focus:bg-white transition-colors" rows={2} placeholder="Add a comment..." /><div className="flex items-center justify-between mt-2"><div className="flex gap-1">{[{ icon: 'fa-solid fa-phone', label: 'Log Call', color: 'text-blue-500', bg: 'hover:bg-blue-50', fn: () => { setLeads(prev => prev.map(l => l.id === leadId ? { ...l, updatedAt: Date.now(), activities: [...(l.activities || []), { type: 'call', text: 'Call logged', at: Date.now(), author: currentUser?.name || 'Admin User' }] } : l)); toast('Call logged'); } }, { icon: 'fa-solid fa-envelope', label: 'Log Email', color: 'text-purple-500', bg: 'hover:bg-purple-50', fn: () => { setLeads(prev => prev.map(l => l.id === leadId ? { ...l, updatedAt: Date.now(), activities: [...(l.activities || []), { type: 'email', text: 'Email logged', at: Date.now(), author: currentUser?.name || 'Admin User' }] } : l)); toast('Email logged'); } }, { icon: 'fa-solid fa-calendar', label: 'Log Meeting', color: 'text-orange-500', bg: 'hover:bg-orange-50', fn: () => { setLeads(prev => prev.map(l => l.id === leadId ? { ...l, updatedAt: Date.now(), activities: [...(l.activities || []), { type: 'meeting', text: 'Meeting logged', at: Date.now(), author: currentUser?.name || 'Admin User' }] } : l)); toast('Meeting logged'); } }].map(b => (<button key={b.label} onClick={b.fn} className={`px-2.5 py-1 rounded-md text-[11px] font-medium ${b.color} ${b.bg} transition-all flex items-center gap-1`}><i className={b.icon}></i>{b.label}</button>))}</div><button onClick={addComment} disabled={!comment.trim()} className="bg-brand-500 hover:bg-brand-600 disabled:bg-gray-200 disabled:text-gray-400 text-white px-4 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all"><i className="fa-solid fa-paper-plane text-[10px]"></i>Send</button></div></div></div></div>
        <div ref={scrollRef} className="flex-1 overflow-y-auto px-6 py-4">
          {activities.length === 0 && <div className="text-center py-12 text-gray-400"><i className="fa-regular fa-comment-dots text-3xl mb-3 block text-gray-300"></i><p className="text-sm">No comments yet. Start the conversation!</p></div>}
          <div className="space-y-0">{activities.slice().reverse().map((act, idx) => { const isLast = idx === 0; const typeIcon = ACT_ICONS[act.type] || 'fa-solid fa-circle text-gray-400'; const typeColor = ACT_COLORS[act.type] || 'bg-gray-100 text-gray-400'; const isComment = act.type === 'note'; return (<div key={idx} className="flex gap-3 relative"><div className="flex flex-col items-center shrink-0"><div className={"w-8 h-8 rounded-full " + typeColor + " flex items-center justify-center text-xs z-10"}><i className={typeIcon}></i></div>{!isLast && <div className="w-px flex-1 bg-gray-200 min-h-[24px]"></div>}</div><div className={"pb-4 flex-1 min-w-0"}><div className="flex items-center gap-2 mb-1"><span className="text-xs font-semibold text-gray-700">{act.author || 'System'}</span><span className="text-[10px] text-gray-400">{fmtFullDate(act.at)}</span>{act.type !== 'note' && act.type !== 'stage' && <span className={"px-1.5 py-0.5 rounded text-[9px] font-medium " + typeColor}>{act.type}</span>}</div>{isComment ? (<div className="text-sm text-gray-600 leading-relaxed bg-gray-50 rounded-xl px-3 py-2 border border-gray-100">{act.text}</div>) : act.type === 'stage' ? (<div className="text-xs text-indigo-600 font-medium flex items-center gap-1"><i className="fa-solid fa-arrow-right text-[10px]"></i>{act.text}</div>) : (<div className="text-xs text-gray-600">{act.text}</div>)}</div></div>); })}</div>
        </div>
      </div>
    </div>
  );
}

function PipelinesView() {
  const { pipelines, setPipelines, tunnels, setTunnels, toast } = useApp();
  const [editMode, setEditMode] = useState(false);
  const [showTunnelForm, setShowTunnelForm] = useState(null);
  const updatePipelineName = (pId, name) => setPipelines(prev => prev.map(p => p.id === pId ? { ...p, name } : p));
  const updateStage = (pId, sId, data) => setPipelines(prev => prev.map(p => p.id === pId ? { ...p, stages: p.stages.map(s => s.id === sId ? { ...s, ...data } : s) } : p));
  const addPipeline = () => setPipelines(prev => [...prev, { id: genId(), name: 'New Pipeline', stages: [{ id: genId(), label: 'Stage 1', color: '#818CF8', bg: '#EEF2FF' }] }]);
  const addStage = (pId) => setPipelines(prev => prev.map(p => p.id === pId ? { ...p, stages: [...p.stages, { id: genId(), label: 'New Stage', color: '#CBD5E1', bg: '#F1F5F9' }] } : p));
  const deletePipeline = (pId) => { setPipelines(prev => prev.filter(p => p.id !== pId)); setTunnels(prev => prev.filter(t => t.toPipelineId !== pId && !pipelines.find(p => p.id === pId)?.stages.some(s => s.id === t.fromStageId))); toast('Pipeline deleted', 'info'); };
  const deleteStage = (pId, sId) => { setPipelines(prev => prev.map(p => p.id === pId ? { ...p, stages: p.stages.filter(s => s.id !== sId) } : p)); setTunnels(prev => prev.filter(t => t.fromStageId !== sId && t.toStageId !== sId)); toast('Stage deleted', 'info'); };
  const saveTunnel = (fromStageId, toPipelineId, toStageId, action) => { setTunnels(prev => [...prev, { id: genId(), fromStageId, toPipelineId, toStageId, action }]); toast('Tunnel created'); setShowTunnelForm(null); };
  const deleteTunnel = (tId) => { setTunnels(prev => prev.filter(t => t.id !== tId)); toast('Tunnel deleted', 'info'); };

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-3"><button onClick={() => setEditMode(!editMode)} className={`px-4 py-2 rounded-lg text-sm font-medium ${editMode ? 'bg-brand-500 text-white' : 'bg-white border border-gray-200 text-gray-600'}`}><i className="fa-solid fa-pen mr-1.5"></i>{editMode ? 'Done Editing' : 'Edit Pipelines'}</button></div>
        {editMode && <button onClick={addPipeline} className="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium"><i className="fa-solid fa-plus mr-1.5"></i>Add Pipeline</button>}
      </div>
      <div className="flex gap-6 overflow-x-auto pb-8 relative">
        {pipelines.map(p => (
          <div key={p.id} className="pipeline-col bg-gray-50 rounded-2xl p-4 border border-gray-100 shrink-0 relative">
            <div className="mb-4 pb-3 border-b border-gray-200 flex items-center justify-between">
              {editMode ? <input value={p.name} onChange={e => updatePipelineName(p.id, e.target.value)} className="bg-white border border-gray-200 rounded-lg px-2 py-1 text-sm font-bold w-full" /> : <h3 className="font-bold text-gray-800 text-sm">{p.name}</h3>}
              {editMode && <button onClick={() => deletePipeline(p.id)} className="text-gray-400 hover:text-red-500 ml-2"><i className="fa-solid fa-trash-can text-xs"></i></button>}
            </div>
            <div className="space-y-2">
              {p.stages.map(s => (
                <div key={s.id} className="relative">
                  <div className="p-3 rounded-lg text-white font-medium text-sm flex items-center justify-between" style={{ background: s.color }}>
                    {editMode ? (<div className="flex items-center gap-2 w-full"><input type="color" value={s.color} onChange={e => updateStage(p.id, s.id, { color: e.target.value, bg: e.target.value + '20' })} className="w-6 h-6 rounded cursor-pointer bg-transparent border-none p-0" /><input value={s.label} onChange={e => updateStage(p.id, s.id, { label: e.target.value })} className="bg-white/20 px-2 py-1 rounded text-white w-full text-xs" /><button onClick={() => deleteStage(p.id, s.id)} className="text-white/80 hover:text-white"><i className="fa-solid fa-times"></i></button></div>) : (<span className="text-xs">{s.label} {s.type && <span className="ml-1 text-[9px] uppercase opacity-80">({s.type})</span>}</span>)}
                  </div>
                  {tunnels.filter(t => t.fromStageId === s.id).map(t => {
                    const targetP = pipelines.find(pp => pp.id === t.toPipelineId);
                    const targetS = targetP?.stages.find(ss => ss.id === t.toStageId);
                    return (<div key={t.id} className="mt-1 ml-2 pl-2 border-l-2 border-brand-500 text-[10px] text-gray-500 flex items-center gap-1"><i className="fa-solid fa-arrow-right text-brand-500"></i><span className="font-medium text-brand-600">{t.action}</span> to {targetP?.name || 'Unknown'} &rarr; {targetS?.label || 'Unknown'}{editMode && <button onClick={() => deleteTunnel(t.id)} className="text-red-400 hover:text-red-600 ml-1"><i className="fa-solid fa-times"></i></button>}</div>);
                  })}
                  {editMode && <button onClick={() => setShowTunnelForm({ fromStageId: s.id, fromPipelineId: p.id })} className="mt-1 ml-2 text-[10px] text-gray-400 hover:text-brand-500 flex items-center gap-1"><i className="fa-solid fa-plus"></i>Add Tunnel</button>}
                </div>
              ))}
            </div>
            {editMode && <button onClick={() => addStage(p.id)} className="mt-4 w-full text-xs text-gray-400 hover:text-brand-500 border-2 border-dashed border-gray-200 rounded-lg py-2">+ Add Stage</button>}
          </div>
        ))}
      </div>
      {showTunnelForm && <TunnelFormModal onClose={() => setShowTunnelForm(null)} onSave={saveTunnel} fromStageId={showTunnelForm.fromStageId} fromPipelineId={showTunnelForm.fromPipelineId} />}
    </div>
  );
}

function TunnelFormModal({ onClose, onSave, fromStageId, fromPipelineId }) {
  const { pipelines, allStages } = useApp();
  const [toPipelineId, setToPipelineId] = useState('');
  const [toStageId, setToStageId] = useState('');
  const [action, setAction] = useState('move');
  const fromStage = allStages.find(s => s.id === fromStageId);
  const handleSave = () => { if (!toPipelineId || !toStageId) { return; } onSave(fromStageId, toPipelineId, toStageId, action); };
  return (
    <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-[200] flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 fade-in" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4"><h2 className="text-lg font-bold text-gray-800">Create Tunnel</h2><button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-lg"></i></button></div>
        <div className="space-y-4">
          <div className="bg-gray-50 p-3 rounded-lg text-sm text-gray-600">From Stage: <b className="text-gray-800">{fromStage?.label || 'Unknown'}</b></div>
          <div><label className="text-xs font-medium text-gray-500 mb-1 block">Target Pipeline</label><select value={toPipelineId} onChange={e => { setToPipelineId(e.target.value); setToStageId(''); }} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm bg-white"><option value="">Select Pipeline</option>{pipelines.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
          {toPipelineId && (<div><label className="text-xs font-medium text-gray-500 mb-1 block">Target Stage</label><select value={toStageId} onChange={e => setToStageId(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm bg-white"><option value="">Select Stage</option>{pipelines.find(p => p.id === toPipelineId)?.stages.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}</select></div>)}
          <div><label className="text-xs font-medium text-gray-500 mb-1 block">Action</label><div className="flex gap-2"><button onClick={() => setAction('move')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${action === 'move' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-500'}`}>Move Lead</button><button onClick={() => setAction('copy')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${action === 'copy' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-500'}`}>Copy Lead</button></div></div>
          <button onClick={handleSave} disabled={!toStageId} className="w-full bg-brand-500 text-white py-3 rounded-xl font-medium text-sm hover:bg-brand-600 disabled:bg-gray-200">Create Tunnel</button>
        </div>
      </div>
    </div>
  );
}

// --- BITRIX24 STYLE COMPANY STRUCTURE ---
function CompanyStructureView() {
  const { orgDepartments, users, setModalContent } = useApp();
  const [selectedDeptId, setSelectedDeptId] = useState(null);
  const [activeDeptId, setActiveDeptId] = useState(null);
  const [isDragOver, setIsDragOver] = useState(null);

  const rootDept = orgDepartments.find(d => !d.parentId);
  const activeDept = orgDepartments.find(d => d.id === activeDeptId) || rootDept;
  const selectedDept = orgDepartments.find(d => d.id === selectedDeptId) || activeDept;

  const childDepts = orgDepartments.filter(d => d.parentId === activeDept.id);

  // Breadcrumbs logic
  const getBreadcrumbs = (dept) => {
    let crumbs = [];
    let current = dept;
    while (current) {
      crumbs.unshift(current);
      current = orgDepartments.find(d => d.id === current.parentId);
    }
    return crumbs;
  };
  const breadcrumbs = getBreadcrumbs(activeDept);

  const handleDrop = (e, targetDeptId) => {
    e.preventDefault();
    const userId = e.dataTransfer.getData('userId');
    const fromDeptId = e.dataTransfer.getData('fromDeptId');
    setIsDragOver(null);
    
    if (!userId || fromDeptId === targetDeptId) return;

    const user = users.find(u => u.id === userId);
    setModalContent(
      <MoveEmployeeModal user={user} fromDeptId={fromDeptId} toDeptId={targetDeptId} onClose={() => setModalContent(null)} />
    );
  };

  return (
    <div className="fade-in flex h-full">
      {/* Tree Structure Area */}
      <div className="flex-1 overflow-auto p-8 flex flex-col min-w-0">
        
        {/* Breadcrumbs */}
        <div className="flex items-center gap-2 mb-6 text-sm">
          {breadcrumbs.map((c, i) => (
            <React.Fragment key={c.id}>
              {i > 0 && <i className="fa-solid fa-chevron-right text-xs text-gray-400"></i>}
              <button onClick={() => { setActiveDeptId(c.id); setSelectedDeptId(c.id); }} className={`font-medium ${activeDept.id === c.id ? 'text-brand-600' : 'text-gray-500 hover:text-gray-700'}`}>{c.name}</button>
            </React.Fragment>
          ))}
        </div>

        {/* Active Department Card (Large) */}
        <div className="mb-8 w-full max-w-md">
          <div className="p-5 rounded-xl border-2 border-brand-500 bg-brand-50 shadow-sm flex items-center gap-4">
            <div className="w-12 h-12 rounded-xl bg-white flex items-center justify-center text-brand-600">
              <i className="fa-solid fa-building text-xl"></i>
            </div>
            <div>
              <h3 className="font-bold text-lg text-gray-800">{activeDept.name}</h3>
              <p className="text-xs text-gray-500 mt-1">{users.filter(u => u.memberships?.some(m => m.deptId === activeDept.id)).length} Employees · {orgDepartments.filter(d => d.parentId === activeDept.id).length} Sub-departments</p>
            </div>
          </div>
        </div>

        {/* Grid of Children */}
        {childDepts.length > 0 ? (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {childDepts.map(child => {
              const empCount = users.filter(u => u.memberships?.some(m => m.deptId === child.id)).length;
              const subDeptCount = orgDepartments.filter(d => d.parentId === child.id).length;
              const isSelected = selectedDept.id === child.id;
              const isDragOverChild = isDragOver === child.id;

              return (
                <div 
                  key={child.id} 
                  onClick={() => setSelectedDeptId(child.id)}
                  onDragOver={(e) => { e.preventDefault(); setIsDragOver(child.id); }}
                  onDragLeave={() => setIsDragOver(null)}
                  onDrop={(e) => handleDrop(e, child.id)}
                  className={`p-4 rounded-xl border-2 cursor-pointer transition-all hover:shadow-md ${isSelected ? 'border-brand-500 bg-brand-50' : 'border-gray-200 bg-white'} ${isDragOverChild ? 'border-brand-500 bg-brand-50 scale-105' : ''}`}
                >
                  <div className="flex items-center justify-between mb-3">
                    <h4 className="font-semibold text-gray-800">{child.name}</h4>
                    <div className="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-500">
                      <i className="fa-solid fa-folder text-sm"></i>
                    </div>
                  </div>
                  <div className="flex items-center gap-3 text-xs text-gray-500">
                    <span><i className="fa-solid fa-user-group mr-1"></i>{empCount} Employees</span>
                    {subDeptCount > 0 && <span><i className="fa-solid fa-sitemap mr-1"></i>{subDeptCount} Sub-depts</span>}
                  </div>
                  {subDeptCount > 0 && (
                    <button 
                      onClick={(e) => { e.stopPropagation(); setActiveDeptId(child.id); setSelectedDeptId(child.id); }}
                      className="mt-3 w-full text-xs text-brand-600 bg-brand-50 hover:bg-brand-100 py-1.5 rounded-md font-medium flex items-center justify-center gap-1"
                    >
                      View Sub-departments <i className="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        ) : (
          <div className="text-center text-gray-400 mt-10">
            <i className="fa-solid fa-folder-open text-4xl mb-3 text-gray-300"></i>
            <p className="text-sm">No sub-departments in {activeDept.name}</p>
          </div>
        )}
      </div>

      {/* Right Side Detail Panel */}
      <div className="w-96 border-l border-gray-100 bg-white p-6 overflow-y-auto shrink-0">
        {selectedDept ? <DeptDetailPanel dept={selectedDept} /> : <div className="text-center text-gray-400 mt-20">Select a department</div>}
      </div>
    </div>
  );
}

function DeptDetailPanel({ dept }) {
  const { orgDepartments, users, setUsers, toast, setModalContent } = useApp();
  const deptUsers = users.filter(u => u.memberships?.some(m => m.deptId === dept.id));
  const head = users.find(u => u.id === dept.headUserId);
  const deputy = users.find(u => u.id === dept.deputyUserId);
  const employees = deptUsers.filter(u => u.id !== dept.headUserId && u.id !== dept.deputyUserId);

  const removeUserFromDept = (userId) => {
    setUsers(prev => prev.map(u => {
      if (u.id === userId) {
        let memberships = (u.memberships || []).filter(m => m.deptId !== dept.id);
        if (memberships.length > 0 && !memberships.some(m => m.isPrimary)) {
          memberships[0].isPrimary = true;
        }
        return { ...u, memberships };
      }
      return u;
    }));
    toast('Employee removed from department', 'info');
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-xl font-bold text-gray-800">{dept.name}</h2>
        <button onClick={() => setModalContent(<DeptModal dept={dept} onClose={() => setModalContent(null)} />)} className="text-gray-400 hover:text-blue-500 p-1.5 rounded-md hover:bg-blue-50" title="Edit Department">
          <i className="fa-solid fa-pen text-xs"></i>
        </button>
      </div>

      <div className="grid grid-cols-3 gap-3 mb-6">
        <div className="bg-gray-50 p-3 rounded-lg text-center">
          <div className="text-xl font-bold text-gray-800">{deptUsers.length}</div>
          <div className="text-[10px] text-gray-500 uppercase tracking-wide">Total</div>
        </div>
        <div className="bg-gray-50 p-3 rounded-lg text-center">
          <div className="text-xl font-bold text-gray-800">{(head ? 1 : 0) + (deputy ? 1 : 0)}</div>
          <div className="text-[10px] text-gray-500 uppercase tracking-wide">Supervisors</div>
        </div>
        <div className="bg-gray-50 p-3 rounded-lg text-center">
          <div className="text-xl font-bold text-gray-800">{employees.length}</div>
          <div className="text-[10px] text-gray-500 uppercase tracking-wide">Employees</div>
        </div>
      </div>

      <button onClick={() => setModalContent(<AddEmpModal dept={dept} onClose={() => setModalContent(null)} />)} className="w-full bg-brand-50 text-brand-600 hover:bg-brand-100 py-2.5 rounded-lg text-sm font-medium mb-6 flex items-center justify-center gap-2">
        <i className="fa-solid fa-plus"></i> Add employees
      </button>

      <div className="mb-6">
        <h4 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Employees</h4>
        <div className="space-y-2">
          {head && <EmpRow user={head} role="Head" deptId={dept.id} onRemove={removeUserFromDept} />}
          {deputy && <EmpRow user={deputy} role="Deputy" deptId={dept.id} onRemove={removeUserFromDept} />}
          {employees.map(emp => <EmpRow key={emp.id} user={emp} role="Employee" deptId={dept.id} onRemove={removeUserFromDept} />)}
          {deptUsers.length === 0 && <div className="text-xs text-gray-400 text-center py-8">No employees in this department</div>}
        </div>
      </div>
    </div>
  );
}

function EmpRow({ user, role, deptId, onRemove }) {
  const { setModalContent } = useApp();

  const handleDragStart = (e) => {
    e.dataTransfer.setData('userId', user.id);
    e.dataTransfer.setData('fromDeptId', deptId);
  };

  return (
    <div 
      className="bg-gray-50 rounded-lg p-3 border border-gray-100 flex items-center gap-3 cursor-grab hover:shadow-sm transition-all group active:cursor-grabbing"
      draggable="true"
      onDragStart={handleDragStart}
      onClick={() => setModalContent(<EmpProfileModal user={user} onClose={() => setModalContent(null)} />)}
    >
      <div className="w-9 h-9 rounded-full bg-brand-100 flex items-center justify-center text-sm font-bold text-brand-600 shrink-0">
        {user.name?.charAt(0) || 'U'}
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-sm font-semibold text-gray-800 truncate">{user.name}</div>
        <div className="text-[10px] text-gray-500 uppercase tracking-wide">{role}</div>
      </div>
      <button 
        onClick={(e) => { e.stopPropagation(); onRemove(user.id); }} 
        className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
      >
        <i className="fa-solid fa-times text-xs"></i>
      </button>
    </div>
  );
}

function DeptModal({ dept, parentId, onClose }) {
  const { orgDepartments, setOrgDepartments, users, toast } = useApp();
  const [name, setName] = useState(dept?.name || '');
  const [headUserId, setHeadUserId] = useState(dept?.headUserId || '');
  const [deputyUserId, setDeputyUserId] = useState(dept?.deputyUserId || '');

  const save = () => {
    if (!name.trim()) { toast('Department name required', 'error'); return; }
    
    if (dept) {
      setOrgDepartments(prev => prev.map(d => d.id === dept.id ? { ...d, name, headUserId: headUserId || null, deputyUserId: deputyUserId || null } : d));
      toast('Department updated');
    } else {
      const newDept = { id: genId(), name, parentId: parentId, headUserId: headUserId || null, deputyUserId: deputyUserId || null };
      setOrgDepartments(prev => [...prev, newDept]);
      toast('Department created');
    }
    onClose();
  };

  return (
    <div className="p-6 max-w-md mx-auto">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-xl font-bold text-gray-800">{dept ? 'Edit Department' : 'Add Department'}</h2>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div className="space-y-4">
        <div>
          <label className="text-xs font-medium text-gray-500 mb-1 block">Department Name *</label>
          <input value={name} onChange={e => setName(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" placeholder="e.g. Sales Department" />
        </div>
        <div>
          <label className="text-xs font-medium text-gray-500 mb-1 block">Department Head</label>
          <select value={headUserId} onChange={e => setHeadUserId(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm bg-white">
            <option value="">-- Select Head --</option>
            {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-medium text-gray-500 mb-1 block">Deputy Supervisor</label>
          <select value={deputyUserId} onChange={e => setDeputyUserId(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm bg-white">
            <option value="">-- Select Deputy --</option>
            {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
        </div>
        <button onClick={save} className="w-full bg-brand-500 text-white py-3 rounded-xl font-medium text-sm hover:bg-brand-600">Save</button>
      </div>
    </div>
  );
}

function AddEmpModal({ dept, onClose }) {
  const { users, setUsers, toast } = useApp();
  const [search, setSearch] = useState('');
  const [selectedUserId, setSelectedUserId] = useState('');

  const filteredUsers = users.filter(u => 
    u.name.toLowerCase().includes(search.toLowerCase()) || 
    u.email.toLowerCase().includes(search.toLowerCase())
  );

  const addEmployee = () => {
    if (!selectedUserId) { toast('Please select an employee', 'error'); return; }
    
    setUsers(prev => prev.map(u => {
      if (u.id === selectedUserId) {
        const memberships = u.memberships || [];
        if (memberships.some(m => m.deptId === dept.id)) {
          toast('Employee already in this department', 'error');
          return u;
        }
        const hasPrimary = memberships.some(m => m.isPrimary);
        memberships.push({ deptId: dept.id, role: 'employee', isPrimary: !hasPrimary });
        return { ...u, memberships };
      }
      return u;
    }));
    
    toast('Employee added to department');
    onClose();
  };

  return (
    <div className="p-6 max-w-md mx-auto">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-xl font-bold text-gray-800">Add Employee to {dept.name}</h2>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div className="space-y-4">
        <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search employee..." className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" />
        <div className="border border-gray-200 rounded-xl max-h-60 overflow-y-auto">
          {filteredUsers.map(u => (
            <div 
              key={u.id} 
              onClick={() => setSelectedUserId(u.id)} 
              className={`p-3 cursor-pointer border-b border-gray-50 ${selectedUserId === u.id ? 'bg-brand-50' : 'hover:bg-gray-50'}`}
            >
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-xs font-bold text-gray-500">{u.name.charAt(0)}</div>
                <div>
                  <div className="text-sm font-medium text-gray-800">{u.name}</div>
                  <div className="text-xs text-gray-400">{u.email}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
        <button onClick={addEmployee} className="w-full bg-brand-500 text-white py-3 rounded-xl font-medium text-sm hover:bg-brand-600">Add to Department</button>
      </div>
    </div>
  );
}

function MoveEmployeeModal({ user, fromDeptId, toDeptId, onClose }) {
  const { orgDepartments, setUsers, toast } = useApp();
  const fromDept = orgDepartments.find(d => d.id === fromDeptId);
  const toDept = orgDepartments.find(d => d.id === toDeptId);

  const handleAction = (action) => {
    setUsers(prev => prev.map(u => {
      if (u.id === user.id) {
        let memberships = [...(u.memberships || [])];
        
        if (action === 'move') {
          memberships = memberships.filter(m => m.deptId !== fromDeptId);
          const hasPrimary = memberships.some(m => m.isPrimary);
          memberships.push({ deptId: toDeptId, role: 'employee', isPrimary: !hasPrimary });
          toast(`Moved ${user.name} to ${toDept.name}`);
        } else {
          if (!memberships.some(m => m.deptId === toDeptId)) {
            memberships.push({ deptId: toDeptId, role: 'employee', isPrimary: false });
            toast(`Added ${user.name} to ${toDept.name}`);
          } else {
            toast('Already in this department', 'error');
          }
        }
        return { ...u, memberships };
      }
      return u;
    }));
    onClose();
  };

  return (
    <div className="p-6 max-w-md mx-auto text-center">
      <div className="w-16 h-16 rounded-full bg-brand-100 flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-arrows-up-down-left-right text-brand-600 text-2xl"></i></div>
      <h2 className="text-xl font-bold text-gray-800 mb-2">Transfer Employee</h2>
      <p className="text-sm text-gray-500 mb-6">What do you want to do with <b>{user.name}</b>?</p>
      <div className="bg-gray-50 p-3 rounded-lg text-sm text-gray-600 mb-6">
        From: <b>{fromDept?.name}</b><br/>
        To: <b>{toDept?.name}</b>
      </div>
      <div className="flex gap-3">
        <button onClick={() => handleAction('move')} className="flex-1 bg-brand-500 hover:bg-brand-600 text-white px-4 py-3 rounded-xl text-sm font-medium">Move</button>
        <button onClick={() => handleAction('add')} className="flex-1 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 px-4 py-3 rounded-xl text-sm font-medium">Add (Multi-dept)</button>
      </div>
      <button onClick={onClose} className="mt-4 text-xs text-gray-400 hover:text-gray-600">Cancel</button>
    </div>
  );
}

function EmpProfileModal({ user, onClose }) {
  const { orgDepartments } = useApp();
  return (
    <div className="p-6 max-w-md mx-auto">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-xl font-bold text-gray-800">Employee Profile</h2>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div className="flex items-center gap-4 mb-6">
        <div className="w-16 h-16 rounded-full bg-brand-100 flex items-center justify-center text-2xl font-bold text-brand-600">{user.name?.charAt(0) || 'U'}</div>
        <div>
          <h3 className="text-lg font-bold text-gray-800">{user.name}</h3>
          <p className="text-sm text-gray-500">{user.email}</p>
          <p className="text-sm text-gray-500">{user.phone}</p>
        </div>
      </div>
      <div>
        <h4 className="text-xs font-semibold text-gray-400 uppercase mb-2">Department Memberships</h4>
        <div className="space-y-2">

}
