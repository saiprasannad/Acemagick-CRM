function WhatsAppView() {
  const { toast, leads, setLeads, currentUser, whatsappTarget, setWhatsappTarget } = useApp();
  const [config, setConfig] = useState(() => getStore('whatsappConfig', { instanceId: '', token: '' }));
  const [showSettings, setShowSettings] = useState(false);
  const [activeLeadId, setActiveLeadId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [inputMsg, setInputMsg] = useState('');
  const [sending, setSending] = useState(false);

  const saveConfig = () => { setStore('whatsappConfig', config); toast('Settings saved!'); setShowSettings(false); };
  const accessibleLeads = useMemo(() => { return leads.filter(l => l.phone && (currentUser?.role === 'Admin' || l.assignedTo === currentUser?.id)); }, [leads, currentUser]);
  const activeLead = accessibleLeads.find(l => l.id === activeLeadId);

  useEffect(() => { if (whatsappTarget) { setActiveLeadId(whatsappTarget); setWhatsappTarget(null); } }, [whatsappTarget, setWhatsappTarget]);

  const fetchMessages = async () => {
    if (!config.instanceId || !config.token || !activeLead) return;
    const chatId = getChatId(activeLead.phone);
    if (!chatId) return;
    try {
      const res = await fetch(`https://api.ultramsg.com/${config.instanceId}/chats/messages?token=${config.token}&chatId=${chatId}&limit=100`);
      const data = await res.json();
      if (Array.isArray(data)) {
        const sorted = data.sort((a, b) => a.time - b.time);
        setMessages(sorted);
        const lastLoggedId = activeLead.lastWaId || "";
        const newIncoming = sorted.filter(m => !parseIsMe(m) && String(m.id) > String(lastLoggedId));
        if (newIncoming.length > 0) {
          const latestId = newIncoming[newIncoming.length - 1].id;
          setLeads(prev => prev.map(l => {
            if (l.id === activeLead.id) {
              const newActivities = newIncoming.map(m => ({ type: 'whatsapp', text: `Customer replied: ${m.text || m.body || ''}`, at: Date.now(), author: activeLead.name }));
              return { ...l, activities: [...(l.activities || []), ...newActivities], lastWaId: latestId };
            }
            return l;
          }));
        }
      } else { console.error("UltraMsg API returned non-array for messages:", data); }
    } catch (e) { console.error("Failed to fetch messages", e); }
  };

  useEffect(() => {
    if (activeLead) {
      fetchMessages();
      const msgPoll = setInterval(fetchMessages, 3000);
      return () => clearInterval(msgPoll);
    } else { setMessages([]); }
  }, [activeLead]);

  const handleSend = async () => {
    if (!inputMsg.trim() || !activeLead) return;
    const chatId = getChatId(activeLead.phone);
    const msgText = inputMsg;
    setInputMsg('');
    setSending(true);
    try {
      const res = await fetch(`https://api.ultramsg.com/${config.instanceId}/messages/chat`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: config.token, to: chatId, body: msgText })
      });
      const data = await res.json();
      if (data === true || data.sent === true || data.sent === 'true') {
        setMessages(prev => [...prev, { from: 'me', text: msgText, time: Math.floor(Date.now()/1000) }]);
        setLeads(prev => prev.map(l => l.id === activeLead.id ? { ...l, updatedAt: Date.now(), activities: [...(l.activities || []), { type: 'whatsapp', text: `You sent: ${msgText}`, at: Date.now(), author: currentUser?.name || 'System' }] } : l));
        toast('Message sent!');
      } else { toast('Failed to send: ' + (data.error || 'Unknown error'), 'error'); }
    } catch (e) { toast('Failed to send message', 'error'); }
    setSending(false);
  };

  return (
    <>
      {!config.instanceId || !config.token ? (
        <div className="fade-in flex h-full items-center justify-center bg-gray-50">
          <div className="text-center bg-white p-8 rounded-2xl shadow-sm border border-gray-100 max-w-md">
            <i className="fa-brands fa-whatsapp text-6xl text-green-500 mb-4"></i>
            <h3 className="text-xl font-bold text-gray-800 mb-2">Connect WhatsApp</h3>
            <p className="text-sm text-gray-500 mb-6">To send and receive messages directly inside the CRM, connect your normal WhatsApp account via UltraMsg.</p>
            <button onClick={() => setShowSettings(true)} className="bg-brand-500 hover:bg-brand-600 text-white px-6 py-3 rounded-xl font-medium text-sm">Connect API</button>
          </div>
        </div>
      ) : (
        <div className="fade-in flex h-[calc(100vh-3.5rem)] -m-6">
          <div className="w-80 shrink-0 bg-white border-r border-gray-100 flex flex-col">
            <div className="p-3 border-b border-gray-100 flex items-center justify-between"><span className="text-sm font-semibold text-gray-800 px-4">CRM Contacts</span><button onClick={() => setShowSettings(true)} className="text-gray-400 hover:text-gray-600 px-3"><i className="fa-solid fa-gear text-xs"></i></button></div>
            <div className="flex-1 overflow-y-auto">
              {accessibleLeads.length === 0 && <div className="p-5 text-center text-gray-400 text-xs">No leads with phone numbers found.</div>}
              {accessibleLeads.map(l => (

          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6" onClick={e => e.stopPropagation()}>

            <div className="space-y-4">
              <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-700"><p className="font-bold mb-1">How to get credentials:</p><p>1. Go to UltraMsg.com and scan the QR code with your WhatsApp.</p><p>2. Copy your Instance ID and Token here.</p></div>

    </>
  );
}

function VoiceCallsView() { const { calls, setCalls, leads, toast } = useApp(); const [dialNumber, setDialNumber] = useState(''); const [calling, setCalling] = useState(false); const [callTimer, setCallTimer] = useState(0); const [callActive, setCallActive] = useState(false); const timerRef = useRef(null); useEffect(() => { if (callActive) timerRef.current = setInterval(() => setCallTimer(p => p + 1), 1000); else clearInterval(timerRef.current); return () => clearInterval(timerRef.current) }, [callActive]); const startCall = () => { if (!dialNumber.trim()) { toast('Enter a number', 'error'); return; } setCalling(true); setCallTimer(0); setTimeout(() => { setCallActive(true); toast('Connected'); }, 1500) }; const endCall = () => { setCallActive(false); setCalling(false); if (callTimer > 0) { const lead = leads.find(l => l.phone === dialNumber); setCalls(prev => [...prev, { id: genId(), leadId: lead ? lead.id : null, contactName: lead ? lead.name : 'Unknown', contactPhone: dialNumber, type: 'outgoing', duration: callTimer, recorded: false, status: 'completed', startedAt: Date.now() - callTimer * 1000, endedAt: Date.now() }]); toast('Call ended · ' + fmtDur(callTimer)); } setDialNumber(''); setCallTimer(0); }; const dialPad = [['1', '2', '3'], ['4', '5', '6'], ['7', '8', '9'], ['*', '0', '#']]; return (<div className="fade-in grid grid-cols-1 lg:grid-cols-2 gap-6"><div className="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm"><h3 className="text-sm font-semibold text-gray-800 mb-5">Dial Pad</h3><div className="max-w-xs mx-auto"><div className="bg-gray-50 rounded-xl px-4 py-3 mb-5 text-center"><span className="text-2xl font-light text-gray-800 tracking-wider">{dialNumber || 'Enter number'}</span></div><div className="grid grid-cols-3 gap-3 mb-5">{dialPad.flat().map(d => <button key={d} onClick={() => setDialNumber(p => p + d)} className="dial-btn bg-gray-50 hover:bg-gray-100 text-gray-700 mx-auto">{d}</button>)}</div><div className="flex gap-3 justify-center function EmailView() { const { emailConfig, setEmailConfig, emailMessages, setEmailMessages, leads, setLeads, toast } = useApp(); const [tab, setTab] = useState('inbox'); const [selectedId, setSelectedId] = useState(null); const [compose, setCompose] = useState(null); const [showSettings, setShowSettings] = useState(false); const [sending, setSending] = useState(false); const [testing, setTesting] = useState(false); const selectedEmail = emailMessages.find(m => m.id === selectedId); const inboxMsgs = emailMessages.filter(m => m.folder === 'inbox').sort((a, b) => b.date - a.date); const sentMsgs = emailMessages.filter(m => m.folder === 'sent').sort((a, b) => b.date - a.date); const currentMsgs = tab === 'inbox' ? inboxMsgs : sentMsgs; const unreadCount = inboxMsgs.filter(m => !m.read).length; const selectEmail = (id) => { setSelectedId(id); setEmailMessages(prev => prev.map(m => m.id === id ? { ...m, read: true } : m)) }; const openCompose = (prefill) => { setCompose({ to: prefill && prefill.to ? prefill.to : '', cc: '', subject: prefill && prefill.subject ? prefill.subject : '', body: prefill && prefill.body ? prefill.body : (emailConfig.signature || ''), leadId: prefill && prefill.leadId ? prefill.leadId : null }) }; const sendEmail = async () => { if (!compose.to.trim()) { toast('Recipient required', 'error'); return; } if (!compose.subject.trim()) { toast('Subject required', 'error'); return; } if (!emailConfig.connected) { toast('Connect email in Settings first', 'error'); return; } setSending(true); try { await emailjs.send(emailConfig.serviceId, emailConfig.templateId, { to_email: compose.to, from_name: emailConfig.fromName, from_email: emailConfig.fromEmail, subject: compose.subject, message: compose.body }, emailConfig.publicKey); const newMsg = { id: genId(), folder: 'sent', from: emailConfig.fromEmail, fromName: emailConfig.fromName, to: compose.to, subject: compose.subject, body: compose.body, date: Date.now(), read: true, leadId: compose.leadId || null } -gray-400">{fmtDate(selectedEmail.date)}</div></div><div className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{selectedEmail.body}</div></div></div>) : <div className="flex-1 flex items-center justify-center text-gray-400"><div className="text-center"><i className="fa-solid fa-envelope-open text-5xl mb-3 text-gray-200"></i><p className="text-sm">Select an email</p></div></div>}</div>{showSettings && <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-[200] flex items-center justify-center p-4" onClick={() => setShowSettings(false)}><div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 fade-in max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}><div className="flex items-center justify-between mb-6"><h2 className="text-lg font-bold text-gray-800"><i className="fa-solid fa-gear mr-2 text-gray-400"></i>Email Settings</h2><button onClick={() => setShowSettings(false)} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-lg"></i></button></div>{ec.connected ? (<div className="text-center py-8"><div className="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-check text-green-600 text-2xl"></i></div><h3 className="text-lg font-semibold text-gray-800 mb-1">Connected</h3><p className="text-sm text-gray-500 mb-1">{ec.fromEmail}</p><p className="text-xs text-gray-400 mb-6">Service: {ec.serviceId}</p><button onClick={() => { setEC('connected', false); toast('Disconnected', 'info'); }} className="bg-red-50 text-red-600 hover:bg-red-100 px-6 py-2.5 rounded-xl text-sm font-medium">Disconnect</button></div>) : (<div className="space-y-4"><div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-700"><i className="fa-solid fa-circle-info mr-2"></i><strong>Setup:</strong><ol className="mt-2 ml-4 list-decimal space-y-1 text-xs"><li>Go to <a href="https://www.emailjs.com" target="_blank" className="underline font-medium"   const pdfRef = useRef(null);
  const [dl, setDl] = useState(false);
  const subtotal = invoice.items.reduce((s, i) => s + i.qty * i.rate, 0);
  const taxAmt = subtotal * (invoice.tax || 18) / 100;
  const grandTotal = subtotal + taxAmt;
  const isPaid = invoice.status === 'paid';

  const handleDownload = async () => {
    setDl(true);
    try {
      await html2pdf().set({
        margin: [0, 0, 0, 0], filename: 'Invoice-' + invoice.number + '.pdf',
        image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }

      toast('PDF downloaded');
    } catch (e) { toast('Failed', 'error'); }
    setDl(false);
  };

  return (
    <div className="p-0">
      <div className="flex items-center justify-between p-5 border-b border-gray-100">
        <h2 className="text-lg font-bold text-gray-800">Invoice Preview</h2>
        <div className="flex items-center gap-2">
          <button onClick={handleDownload} disabled={dl} className="bg-brand-500 hover:bg-brand-600 disabled:bg-brand-300 text-white px-5 py-2 rounded-lg text-sm font-medium flex items-center gap-2"><i className={"fa-solid " + (dl ? 'fa-spinner fa-spin' : 'fa-download')}></i>{dl ? 'Generating...' : 'Download PDF'}</button>
          <button onClick={() => setModalContent(null)} className="text-gray-400 hover:text-gray-600 p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
        </div>
      </div>
      <div className="p-6 bg-gray-100 flex justify-center overflow-y-auto max-h-[75vh]">
        <div ref={pdfRef} style={{ width: '794px', minHeight: '1123px', padding: '48px', background: '#fff', fontFamily: 'DM Sans, sans-serif' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '40px' }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '12px' }}><div style={{ width: '44px', height: '44px', borderRadius: '12px', background: '#10b981', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: '22px', fontWeight: 700 }}>N</div><span style={{ fontSize: '24px', fontWeight: 700, color: '#0B1120' }}>NexaCRM</span></div>
              <p style={{ fontSize: '13px', color: '#64748b', margin: 0 }}>123 Business Avenue, Bengaluru</p><p style={{ fontSize: '13px', color: '#64748b', margin: 0 }}>admin@nexacrm.com4</p>
            </div>
            <div style={{ textAlign: 'right' }}>
              <h1 style={{ fontSize: '28px', fontWeight: 800, color: '#0B1120', margin: 0 }}>INVOICE</h1>
              <p style={{ fontSize: '14px', color: '#10b981', fontWeight: 600, margin: '4px 0 16px' }}>{invoice.number}</p>
              <p style={{ fontSize: '13px', color: '#64748b', margin: 0 }}>Date: {fmtDate(invoice.createdAt)}</p>
              <p style={{ fontSize: '13px', color: '#64748b', margin: '4px 0 0' }}>Due: {fmtDate(invoice.dueDate)}</p>
              <p style={{ fontSize: '13px', margin: '8px 0 0' }}><span style={{ background: isPaid ? '#d1fae5' : '#fef3c7', color: isPaid ? '#059669' : '#d97706', padding: '2px 10px', borderRadius: '20px', fontSize: '12px', fontWeight: 600 }}>{invoice.status.toUpperCase()}</span></p>
            </div>
          </div>
          <div style={{ background: '#f8fafc', borderRadius: '12px', padding: '20px', marginBottom: '32px', border: '1px solid #e2e8f0' }}>
            <p style={{ fontSize: '11px', fontWeight: 700, color: '#94a3b8', textTransform: 'uppercase', marginBottom: '8px' }}>Bill To</p>
            <p style={{ fontSize: '16px', fontWeight: 600, color: '#1e293b', margin: 0 }}>{invoice.customerName}</p>
            <p style={{ fontSize: '13px', color: '#64748b', margin: '2px 0 0' }}>{invoice.customerEmail}</p>
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '24px', fontSize: '13px' }}>
            <thead><tr style={{ background: '#0B1120' }}><th style={{ padding: '12px', textAlign: 'left', color: '#fff', fontWeight: 600, fontSize: '12px' }}>#</th><th style={{ padding: '12px', textAlign: 'left', color: '#fff', fontWeight: 600, fontSize: '12px' }}>Description</th><th style={{ padding: '12px', textAlign: 'center', color: '#fff', fontWeight: 600, fontSize: '12px' }}>Qty</th><th style={{ padding: '12px', textAlign: 'right', color: '#fff', fontWeight: 600, fontSize: '12px' }}>Rate</th><th style={{ padding: '12px', textAlign: 'right', color: '#fff', fontWeight: 600, fontSize: '12px' }}>Amount</th></tr></thead>
            <tbody>{invoice.items.map((item, idx) => <tr key={idx} style={{ borderBottom: '1px solid #f1f5f9' }}><td style={{ padding: '14px 12px', color: '#94a3b8' }}>{idx + 1}</td><td style={{ padding: '14px 12px', color: '#1e293b', fontWeight: 500 }}>{item.desc}</td><td style={{ padding: '14px 12px', textAlign: 'center', color: '#475569' }}>{item.qty}</td><td style={{ padding: '14px 12px', textAlign: 'right', color: '#475569' }}>{fmtCur(item.rate)}</td><td style={{ padding: '14px 12px', textAlign: 'right', color: '#1e293b', fontWeight: 600 }}>{fmtCur(item.qty * item.rate)}</td></tr>)}</tbody>
          </table>
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: '32px' }}>
            <table style={{ fontSize: '13px', borderCollapse: 'collapse', minWidth: '260px' }}>
              <tbody>
                <tr><td style={{ padding: '8px 0', color: '#64748b' }}>Subtotal</td><td style={{ padding: '8px 16px', textAlign: 'right', color: '#1e293b', fontWeight: 500 }}>{fmtCur(subtotal)}</td></tr>
                <tr><td style={{ padding: '8px 0', color: '#64748b' }}>Tax ({invoice.tax || 18}%)</td><td style={{ padding: '8px 16px', textAlign: 'right', color: '#1e293b', fontWeight: 500 }}>{fmtCur(taxAmt)}</td></tr>
                <tr style={{ borderTop: '2px solid #0B1120' }}><td style={{ padding: '12px 0', color: '#0B1120', fontWeight: 700, fontSize: '15px' }}>Grand Total</td><td style={{ padding: '12px 16px', textAlign: 'right', color: '#0B1120', fontWeight: 800, fontSize: '18px' }}>{fmtCur(grandTotal)}</td></tr>
              </tbody>
            </table>
          </div>
          {isPaid && (<div style={{ textAlign: 'center', marginBottom: '24px' }}><span style={{ display: 'inline-block', border: '4px solid #059669', borderRadius: '50%', width: '100px', height: '100px', lineHeight: '92px', fontSize: '24px', fontWeight: 900, color: '#059669', transform: 'rotate(-15deg)', opacity: 0.3 }}>PAID</span></div>)}
          <div style={{ background: '#f8fafc', borderRadius: '12px', padding: '20px', marginBottom: '32px', border: '1px solid #e2e8f0' }}>
            <p style={{ fontSize: '11px', fontWeight: 700, color: '#94a3b8', textTransform: 'uppercase', marginBottom: '10px' }}>Bank Details</p>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px', fontSize: '13px' }}>
              <div><span style={{ color: '#94a3b8' }}>Bank:</span> <span style={{ color: '#1e293b', fontWeight: 500 }}>HDFC Bank</span></div>
              <div><span style={{ color: '#94a3b8' }}>A/C:</span> <span style={{ color: '#1e293b', fontWeight: 500 }}>50100372644891</span></div>
              <div><span style={{ color: '#94a3b8' }}>IFSC:</span> <span style={{ color: '#1e293b', fontWeight: 500 }}>HDFC0002876</span></div>
              <div><span style={{ color: '#94a3b8' }}>Branch:</span> <span style={{ color: '#1e293b', fontWeight: 500 }}>Koramangala</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function InviteAgentModal() {
  const { invitations, setInvitations, users, toast, setModalContent, emailConfig } = useApp();
  const [method, setMethod] = useState('email');
  const [contact, setContact] = useState('');
  const [sending, setSending] = useState(false);
  const handleInvite = async () => {
    if (!contact.trim()) { toast('Please enter an email or phone number', 'error'); return; }
    if (method === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)) { toast('Invalid email format', 'error'); return; }
    if (method === 'phone' && !/^\+?[\d\s-]{10,}$/.test(contact)) { toast('Invalid phone format', 'error'); return; }
    if (users.some(u => u.email === contact || u.phone === contact)) { toast('This person is already a member!', 'error'); return; }
    const token = genToken();
    const baseUrl = window.location.origin + window.location.pathname;
    const inviteLink = `${baseUrl}?token=${token}`;
    const newInvite = { email: method === 'email' ? contact : '', phone: method === 'phone' ? contact : '', token, status: 'pending', expires_at: new Date(Date.now() + 172800000).toISOString() };
    setSending(true);
    const { data: savedInvite, error } = await supabase.from('invitations').insert(newInvite).select().single();
    if (error) { toast('Failed to create invite in database.', 'error'); setSending(false); return; }
    setInvitations(prev => [...prev, savedInvite]);
    if (method === 'email') {
      if (emailConfig.connected) {
        try {
          await emailjs.send(emailConfig.serviceId, emailConfig.templateId, {
            to_email: contact, from_name: emailConfig.fromName, from_email: emailConfig.fromEmail,
            subject: `You're invited to join ${emailConfig.fromName}'s CRM!`,
            message: `Hi,\n\n${emailConfig.fromName} has invited you to join their CRM. Click the link below to accept and set up your password:\n\n${inviteLink}\n\nThis link expires in 48 hours.`,
            invite_link: inviteLink
          }, emailConfig.publicKey);
          toast('Invite email sent successfully!');
        } catch (err) { console.error('EmailJS Error:', err); toast('Failed to send email. Check Email Settings.', 'error'); }
        setSending(false);
      } else { toast('Email not connected! Invite link generated below. Configure in Email > Settings.', 'info'); }
    } else { toast('Invite generated! (SMS requires a backend API like Twilio)'); }
    setModalContent(null);
  };
  return (
    <div className="p-6 max-w-md mx-auto">
      <div className="flex items-center justify-between mb-6"><h2 className="text-xl font-bold text-gray-800">Invite Agent</h2><button onClick={() => setModalContent(null)} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-lg"></i></button></div>
      <div className="space-y-4">
        <div><label className="text-xs font-medium text-gray-500 mb-1 block">How would you like to send the invite?</label><div className="flex gap-2 mt-1"><button onClick={() => setMethod('email')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${method === 'email' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-500'}`}><i className="fa-solid fa-envelope mr-1"></i>Email</button><button onClick={() => setMethod('phone')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${method === 'phone' ? 'bg-brand-500 text-white' : 'bg-gray-100 text-gray-500'}`}><i className="fa-solid fa-phone mr-1"></i>Phone</button></div></div>
        <div><label className="text-xs font-medium text-gray-500 mb-1 block">{method === 'email' ? 'Agent Email Address' : 'Agent Phone Number'}</label><input type={method === 'email' ? 'email' : 'tel'} value={contact} onChange={e => setContact(e.target.value)} className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm" placeholder={method === 'email' ? 'agent@example.com' : '+91 12345 67890'} /></div>
        {method === 'email' && !emailConfig.connected && (<p className="text-xs text-amber-600 bg-amber-50 p-3 rounded-lg">⚠️ Your email is not connected. Go to <b>Email {'>'} Settings</b> to connect EmailJS so you can send real invites.</p>)}
        <button onClick={handleInvite} disabled={sending} className="w-full bg-brand-500 text-white py-3 rounded-xl font-medium text-sm hover:bg-brand-600 flex items-center justify-center gap-2">{sending ? <><i className="fa-solid fa-spinner fa-spin"></i> Sending...</> : <><i className="fa-solid fa-paper-plane mr-2"></i>Generate & Send Invite</>}</button>
      </div>
    </div>
  );
}

function TeamView() {
  const { users, invitations, setInvitations, toast, setModalContent, currentUser, emailConfig } = useApp();
  const revokeInvite = async (id) => { await supabase.from('invitations').update({ status: 'revoked' }).eq('id', id); setInvitations(prev => prev.map(inv => inv.id === id ? { ...inv, status: 'revoked' } : inv)); toast('Invite revoked', 'info'); };
  const resendInvite = async (inv) => {
    const newToken = genToken();
    const baseUrl = window.location.origin + window.location.pathname;
    const inviteLink = `${baseUrl}?token=${newToken}`;
    const { data: updatedInvite } = await supabase.from('invitations').update({ token: newToken, status: 'pending', expires_at: new Date(Date.now() + 172800000).toISOString() }).eq('id', inv.id).select().single();
    setInvitations(prev => prev.map(i => i.id === inv.id ? updatedInvite : i));
    if (inv.email && emailConfig.connected) {
      toast('Resending email...');
      try {
        await emailjs.send(emailConfig.serviceId, emailConfig.templateId, {
          to_email: inv.email, from_name: emailConfig.fromName, from_email: emailConfig.fromEmail,
          subject: `Reminder: Accept your CRM invite`,
          message: `Hi,\n\nThis is a reminder to join ${emailConfig.fromName}'s CRM. Click the link below:\n\n${inviteLink}`,
          invite_link: inviteLink
        }, emailConfig.publicKey);
        toast('Invite email resent successfully!');
      } catch (err) { toast('Failed to resend email. Check settings.', 'error'); }
    } else { toast('Invite link refreshed. (Connect email to send automatically)'); }
  };
  const roleColors = { Admin: 'bg-purple-100 text-purple-700', Agent: 'bg-blue-100 text-blue-700' };
  const statusColors = { active: 'bg-green-100 text-green-700', invited: 'bg-gray-100 text-gray-600', revoked: 'bg-red-100 text-red-600', expired: 'bg-orange-100 text-orange-600' };
  const inviteStatusColors = { pending: 'bg-amber-100 text-amber-700', accepted: 'bg-green-100 text-green-700', revoked: 'bg-red-100 text-red-600', expired: 'bg-orange-100 text-orange-600' };
  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-5">
        <div className="text-sm text-gray-500">{users.length} member(s) · {invitations.filter(i => i.status === 'pending').length} pending invite(s)</div>
        <button onClick={() => setModalContent(<InviteAgentModal />)} className="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium"><i className="fa-solid fa-plus mr-1.5"></i>Invite Agent</button>
      </div>
      <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden mb-8">
        <h3 className="text-sm font-semibold text-gray-800 px-5 py-3 border-b border-gray-100">Team Members</h3>
        <table className="w-full text-sm">
          <thead><tr className="bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase"><th className="px-5 py-3">Member</th><th className="px-5 py-3">Role</th><th className="px-5 py-3">Status</th><th className="px-5 py-3">Actions</th></tr></thead>
          <tbody>
            {users.map(u => (
              <tr key={u.id} className="border-t border-gray-50">
                <td className="px-5 py-3 flex items-center gap-3"><div className="w-9 h-9 rounded-full bg-brand-50 flex items-center justify-center text-sm font-bold text-brand-600">{u.name.split(' ').map(n => n[0]).join('')}</div><div><div className="font-medium text-gray-800">{u.name}</div><div className="text-xs text-gray-400">{u.email}</div></div></td>
                <td className="px-5 py-3"><span className={"px-2.5 py-1 rounded-full text-xs font-semibold " + (roleColors[u.role] || 'bg-gray-100 text-gray-600')}>{u.role}</span></td>
                <td className="px-5 py-3"><span className={"px-2.5 py-1 rounded-full text-xs font-semibold " + (statusColors[u.status] || 'bg-gray-100 text-gray-600')}>{u.status}</span></td>
                <td className="px-5 py-3">{u.id !== currentUser?.id && <button className="text-gray-300 hover:text-red-500"><i className="fa-solid fa-trash-can text-xs"></i></button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {invitations.length > 0 && (
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
          <h3 className="text-sm font-semibold text-gray-800 px-5 py-3 border-b border-gray-100">Invitations</h3>
          <div className="divide-y divide-gray-50">
            {invitations.map(inv => {
              const isExpired = Date.now() > new Date(inv.expires_at).getTime() && inv.status === 'pending';
              const isPending = inv.status === 'pending' && !isExpired;
              const baseUrl = window.location.origin + window.location.pathname;
              const inviteLink = `${baseUrl}?token=${inv.token}`;
              return (
                <div key={inv.id} className="p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
                  <div>
                    <div className="text-sm font-medium text-gray-800">{inv.email || inv.phone}</div>
                    <div className="text-xs text-gray-400 mt-1">Sent: {fmtDate(inv.created_at)} · Expires: {fmtDate(inv.expires_at)}</div>
                    {isPending && (<div className="mt-2 bg-gray-50 p-2 rounded-lg text-[11px] text-gray-500 flex items-center gap-2 border border-gray-100"><i className="fa-solid fa-link text-brand-500"></i><span className="truncate font-mono" title={inv.token}>{inviteLink}</span><button onClick={() => { navigator.clipboard.writeText(inviteLink); toast('Link copied!'); }} className="text-brand-500 hover:text-brand-600 shrink-0 ml-2"><i className="fa-solid fa-copy"></i></button></div>)}
                  </div>
                  <div className="flex items-center gap-3">
                    <span className={"px-2.5 py-1 rounded-full text-xs font-semibold " + (isExpired ? inviteStatusColors.expired : inviteStatusColors[inv.status])}>{isExpired ? 'expired' : inv.status}</span>
                    {isPending && (<div className="flex gap-2"><button onClick={() => setModalContent(<AcceptInviteModal prefilledToken={inv.token} />)} className="text-xs bg-brand-50 text-brand-600 px-3 py-1.5 rounded-lg font-medium hover:bg-brand-100">Simulate Agent Accept</button><button onClick={() => resendInvite(inv)} className="text-xs text-gray-400 hover:text-blue-500" title="Resend Invite"><i className="fa-solid fa-paper-plane"></i></button><button onClick={() => revokeInvite(inv.id)} className="text-xs text-gray-400 hover:text-red-500" title="Revoke Invite"><i className="fa-solid fa-ban"></i></button></div>)}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const { loggedIn, view, setModalContent } = useApp();
  const [checkedUrl, setCheckedUrl] = useState(false);
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (token) { setModalContent(<AcceptInviteModal prefilledToken={token} />); }
    setCheckedUrl(true);
  }, []);
  if (!loggedIn && checkedUrl) return <Login />;
  if (!loggedIn) return <Login />;
  const renderView = () => { 
    switch (view) { 
      case 'dashboard': return <Dashboard />; 
      case 'leads': return <LeadsView />; 
      case 'pipelines': return <PipelinesView />; 
      case 'whatsapp': return <WhatsAppView />; 
      case 'calls': return <VoiceCallsView />; 
      case 'email': return <EmailView />; 
      case 'quotations': return <QuotationsView />; 
      case 'invoices': return <InvoicesView />; 
      case 'team': return <TeamView />; 
      case 'org': return <CompanyStructureView />;
      default: return <Dashboard />; 
    } 
  };
  return <div className="flex h-screen"><Sidebar /><div className="flex-1 flex flex-col min-w-0"><TopBar /><main className="flex-1 overflow-y-auto p-6">{renderView()}</main></div><Modal /><Toasts /></div>;
}

function Root() { return <AppProvider><App /></AppProvider>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
